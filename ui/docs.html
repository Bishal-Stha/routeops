<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteOps API Specification - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090B;
      --card: #121215;
      --border: #27272A;
      --text: #F4F4F5;
      --text-muted: #A1A1AA;
      --emerald: #10B981;
    }
    [data-theme="light"] {
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --border: #E4E4E7;
      --text: #09090B;
      --text-muted: #71717A;
      --emerald: #059669;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .docs-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .docs-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
    }
    .docs-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .badge-openapi {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .docs-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-toggle-btn:hover {
      border-color: var(--emerald);
    }
    .theme-toggle-btn .sun-icon { display: block; }
    .theme-toggle-btn .moon-icon { display: none; }
    [data-theme="light"] .theme-toggle-btn .sun-icon { display: none; }
    [data-theme="light"] .theme-toggle-btn .moon-icon { display: block; }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .back-btn:hover {
      border-color: var(--emerald);
    }
    /* Swagger UI Theme Overrides */
    #swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 60px 24px;
    }
    .swagger-ui .topbar { display: none !important; }
    .swagger-ui {
      color: var(--text) !important;
    }
    .swagger-ui .info .title {
      color: var(--text) !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 26px !important;
      letter-spacing: -0.02em !important;
    }
    .swagger-ui .info p, .swagger-ui .info li, .swagger-ui .info table {
      color: var(--text-muted) !important;
      font-size: 14px !important;
    }
    .swagger-ui .opblock {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      box-shadow: none !important;
      margin-bottom: 12px !important;
    }
    .swagger-ui .opblock .opblock-summary {
      padding: 10px 14px !important;
    }
    .swagger-ui .opblock .opblock-summary-path {
      color: var(--text) !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 13px !important;
    }
    .swagger-ui .opblock .opblock-summary-description {
      color: var(--text-muted) !important;
      font-size: 12px !important;
    }
    .swagger-ui .opblock-body {
      background: var(--bg) !important;
      border-top: 1px solid var(--border) !important;
    }
    .swagger-ui table thead tr th {
      color: var(--text-muted) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .swagger-ui table tbody tr td {
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .swagger-ui .parameter__name {
      color: var(--text) !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    .swagger-ui .parameter__type {
      color: var(--text-muted) !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    .swagger-ui .btn {
      border-radius: 6px !important;
      font-family: 'Inter', sans-serif !important;
    }
    .swagger-ui .btn.execute {
      background-color: var(--card) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }
    .swagger-ui .response-col_status {
      color: var(--emerald) !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    .swagger-ui pre {
      background: var(--bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      font-family: 'JetBrains Mono', monospace !important;
    }
    .swagger-ui .model-box {
      background: var(--card) !important;
    }
    .swagger-ui .scheme-container {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px;
      box-shadow: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="docs-topbar">
    <a href="/" class="docs-brand">
      <div class="brand-logo">RO</div>
      <span class="docs-title">RouteOps Gateway Specification</span>
      <span class="badge-openapi">OpenAPI 3.1.0</span>
    </a>
    <div class="docs-actions">
      <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
        <!-- Sun icon -->
        <svg class="sun-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon -->
        <svg class="moon-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <a href="/" class="back-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Triage Playground
      </a>
    </div>
  </header>

  <!-- Swagger UI Mount Container -->
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    // Initialize theme on load from localStorage
    const savedTheme = localStorage.getItem('routeops-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const toggleBtn = document.getElementById('theme-toggle-btn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('routeops-theme', next);
      });
    }

    window.onload = function() {
      SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
