# RouteOps Configuration Specification
# Optimized for multilingual semantic routing and 4GB RTX 2050 edge envelope

project:
  name: "RouteOps"
  version: "0.1.0"
  description: "Multilingual Semantic Router with Dynamic Cost Optimization & MLOps Observability"

hardware:
  device: "cuda"
  vram_budget_mb: 3072  # Strict 3.0 GB ceiling for RTX 2050 (4.0 GB total)
  cpu_threads: 8
  fp16_enabled: true

model:
  name: "distilbert-base-multilingual-cased"
  tokenizer_name: "distilbert-base-multilingual-cased"
  max_length: 128
  num_labels: 4
  output_dir: "./models/routeops-distilbert"
  onnx_output_path: "./models/onnx/model.onnx"
  quantized_onnx_path: "./models/onnx/model_quantized.onnx"

training:
  learning_rate: 3.0e-5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8  # Effective batch size: 32
  num_train_epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: true
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "f1"
  seed: 42

routing:
  labels:
    0: "direct_response"
    1: "rag_retrieval"
    2: "frontier_reasoning"
    3: "guardrail_blocked"

  descriptions:
    direct_response: "Simple greetings, deterministic FAQs, small-talk"
    rag_retrieval: "Domain-specific knowledge, Nepali banking, civic queries, internal docs"
    frontier_reasoning: "Complex problem solving, coding, mathematical proofs, multi-step logic"
    guardrail_blocked: "Prompt injection, jailbreaks, toxic inputs, system extraction attempts"

  thresholds:
    direct_response: 0.80
    rag_retrieval: 0.75
    frontier_reasoning: 0.70
    guardrail_flag: 0.60

  token_costs_per_1k:
    direct_response: 0.0001
    rag_retrieval: 0.0015
    frontier_reasoning: 0.0300
    guardrail_blocked: 0.0000

  supported_languages:
    - code: "en"
      name: "English"
    - code: "ne-rom"
      name: "Romanized Nepali"
    - code: "ne"
      name: "Devanagari Nepali"

monitoring:
  prometheus_port: 8000
  drift_window_size: 1000
  entropy_threshold: 1.2
  latency_slo_ms: 15.0

gateway:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "*"
