version: "3.8"

services:
  routeops-gateway:
    build: .
    container_name: routeops-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ROUTEOPS_ENV=production
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - routeops-net

networks:
  routeops-net:
    driver: bridge
